# Nginx config INSIDE the web container. It only serves the built static SPA.
# All TLS, redirects and API routing happen in the edge proxy
# (deploy/nginx/templates/default.conf.template), one layer up.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact Nginx version.
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames under /assets, so they can be cached
    # forever — a new deploy produces new filenames.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, otherwise browsers keep loading the old
    # bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback: client-side routes like /clients/123 are not real files, so
    # unknown paths return index.html and React Router resolves them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
