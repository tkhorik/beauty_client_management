# Shared proxy settings, included by every location that forwards upstream.
#
# Without these headers the backend sees every request as coming from the
# proxy container over plain HTTP, which breaks client-IP logging and any
# scheme-aware URL the app generates.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";

# Uploading a large photo over a slow mobile connection should not be cut off.
proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

# Do not let the upstream's own CORS or caching headers override the policy
# defined at the edge.
proxy_buffering on;
