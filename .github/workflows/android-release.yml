# Android release: signed APK attached to a GitHub Release.
#
# TRIGGER — a pushed tag matching v*.*.*, e.g. `git tag v1.2.0 && git push origin v1.2.0`.
# Tags are chosen over `push: branches: [main]` (like deploy.yml uses) because
# app releases and backend/web deploys are on different cadences: you deploy
# the backend on every merge, but you cut a new Android version deliberately,
# with a version bump. workflow_dispatch is kept for rebuilding an existing
# tag (e.g. after rotating the release API URL) without creating a new tag.
#
# Distribution model: GitHub Releases. No Play Console / Firebase account
# needed — users download the APK asset directly from the release page.

name: Android release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild (leave blank to use the current ref)'
        required: false
        type: string

permissions:
  contents: write # required to create a release and upload assets

jobs:
  build-and-release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The keystore never touches git. It is stored base64-encoded in a
      # GitHub Secret and decoded to a file that only exists on the CI
      # runner's disk, which is destroyed when the job finishes.
      # Written to android/release.jks, NOT android/app/release.jks: the
      # storeFile in keystore.properties is resolved by build.gradle.kts with
      # rootProject.file(), and the Android build's rootProject is `android/`.
      # These two paths must agree or assembleRelease fails with
      # "Keystore file not found".
      - name: Decode release keystore
        working-directory: android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      # keystore.properties is read by app/build.gradle.kts's signingConfigs
      # block — the exact same file a developer would create locally, so
      # there is only one signing code path to maintain, not a CI-only one.
      - name: Write keystore.properties
        working-directory: android
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Resolve release tag
        id: tag
        run: |
          T="${{ inputs.tag }}"
          if [ -z "$T" ]; then T="${GITHUB_REF_NAME}"; fi
          echo "tag=${T}" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PreleaseApiBaseUrl=${{ vars.SITE_URL || format('https://{0}', vars.DOMAIN) }}/

      # Shred the decoded key material and property file so nothing signing
      # related lingers in the runner's workspace artifacts/logs.
      - name: Clean up signing material
        if: always()
        working-directory: android
        run: rm -f release.jks keystore.properties

      - name: Rename APK to include version
        working-directory: android
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/release/app-release.apk \
             "release-out/aura-beauty-log-${{ steps.tag.outputs.tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Aura Beauty Log ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: android/release-out/*.apk
          body: |
            Signed release build of the Android app, pointed at `${{ vars.SITE_URL || format('https://{0}', vars.DOMAIN) }}/`.

            Install: download the APK below, enable "install unknown apps" for
            your browser/file manager, and open it. Users with an existing
            install get an in-place upgrade only if this APK was signed with
            the same keystore as their current version.
