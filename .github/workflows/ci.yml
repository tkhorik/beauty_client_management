# Pull-request checks.
#
# These are the jobs you mark as "Required status checks" in the branch
# protection rule for `main`. Nothing can be merged until they pass, which is
# what makes the deploy workflow safe: by the time code reaches main it has
# already compiled and linted.

name: CI

on:
  pull_request:
    branches: [main]
  # Also run on main so the badge reflects the state of the released branch.
  push:
    branches: [main]

# A new push to the same PR cancels the previous run instead of queueing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Ktor / JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build and test
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

  web:
    name: Web (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Type-check and build
        working-directory: web
        run: npm run build

  android:
    name: Android (Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Assemble debug and run unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
