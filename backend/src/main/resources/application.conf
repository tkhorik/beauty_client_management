ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.beauty.ApplicationKt.module ]
    }
}

# ---------------------------------------------------------------------------
# NOTHING SECRET BELONGS IN THIS FILE. It is committed to git.
# Every value below is a safe local-development default that can be overridden
# by an environment variable. In production, docker-compose injects the real
# values from the .env file on the VPS, which is never committed.
# ---------------------------------------------------------------------------

app {
    # "development" or "production". Set APP_ENV=production on the VPS.
    # In production the app refuses to start with dev secrets or an
    # unreachable database, instead of silently running in a broken state.
    environment = "development"
    environment = ${?APP_ENV}

    # Comma-separated list of extra browser origins allowed to call the API.
    # Leave empty in the single-domain production setup: the web app is served
    # from the same origin as the API, so CORS never applies.
    allowedOrigins = ""
    allowedOrigins = ${?ALLOWED_ORIGINS}

    # Directory for uploaded attachment files. In Docker this is a mounted
    # volume so uploads survive container rebuilds.
    uploadDir = "uploads"
    uploadDir = ${?UPLOAD_DIR}
}

jwt {
    # The default is deliberately marked insecure: startup fails in production
    # if this exact value is still in use.
    secret = "dev-only-insecure-secret-change-me"
    secret = ${?JWT_SECRET}
    issuer = "aura-beauty-log"
    issuer = ${?JWT_ISSUER}
    audience = "aura-beauty-log-users"
    audience = ${?JWT_AUDIENCE}
    realm = "Beauty Client Management"

    # How long an access token stays valid. Access tokens are stateless and
    # cannot be revoked, so this expiry is the only bound on the damage a
    # leaked one can do. Keep it short; the refresh token below is what keeps
    # the user signed in, and that one can be revoked.
    accessTokenMinutes = 15
    accessTokenMinutes = ${?ACCESS_TOKEN_MINUTES}

    # How long a user stays signed in without re-entering their password.
    refreshTokenDays = 30
    refreshTokenDays = ${?REFRESH_TOKEN_DAYS}
}

db {
    driver = "org.postgresql.Driver"
    driver = ${?DB_DRIVER}
    url = "jdbc:postgresql://localhost:5432/beautydb"
    url = ${?DB_URL}
    user = "postgres"
    user = ${?DB_USER}
    password = "postgrespassword"
    password = ${?DB_PASSWORD}

    # HikariCP connection pool size. Keep this well below Postgres'
    # max_connections (default 100).
    maxPoolSize = 10
    maxPoolSize = ${?DB_MAX_POOL_SIZE}

    # Falling back to in-memory H2 when Postgres is unreachable is convenient
    # locally and catastrophic in production: the API would report healthy
    # while silently discarding every write. Forced to false when
    # APP_ENV=production.
    allowH2Fallback = true
    allowH2Fallback = ${?DB_ALLOW_H2_FALLBACK}
}
