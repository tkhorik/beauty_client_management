ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.beauty.ApplicationKt.module ]
    }
}

# ---------------------------------------------------------------------------
# NOTHING SECRET BELONGS IN THIS FILE. It is committed to git.
# Every value below is a safe local-development default that can be overridden
# by an environment variable. In production, docker-compose injects the real
# values from the .env file on the VPS, which is never committed.
# ---------------------------------------------------------------------------

app {
    # "development" or "production". Set APP_ENV=production on the VPS.
    # In production the app refuses to start with dev secrets or an
    # unreachable database, instead of silently running in a broken state.
    environment = "development"
    environment = ${?APP_ENV}

    # Comma-separated list of extra browser origins allowed to call the API.
    # Leave empty in the single-domain production setup: the web app is served
    # from the same origin as the API, so CORS never applies.
    allowedOrigins = ""
    allowedOrigins = ${?ALLOWED_ORIGINS}

    # Directory for uploaded attachment files. In Docker this is a mounted
    # volume so uploads survive container rebuilds.
    uploadDir = "uploads"
    uploadDir = ${?UPLOAD_DIR}

    # Canonical public origin, no trailing slash. Used to build the links inside
    # verification and password-reset emails.
    #
    # This is read from config rather than from the request's Host header on
    # purpose. If the link origin came from the request, anyone could POST to
    # /api/auth/forgot-password with `Host: evil.test` and cause the *real*
    # owner of an account to receive a reset link pointing at their server.
    # The local default matches the Vite dev server.
    publicUrl = "http://127.0.0.1:5174"
    publicUrl = ${?SITE_URL}

    # Comma-separated addresses promoted to the global SUPER_ADMIN role at
    # startup. Empty by default — a fresh install has no super admin, and
    # nothing needs one, since organizations are self-service.
    #
    # This is configuration rather than an API on purpose: an endpoint that can
    # grant unrestricted access to every organization in the system is an
    # endpoint worth attacking. Promotion is one-directional; removing an
    # address here does not demote the account (do that with a manual UPDATE),
    # because silently dropping the last super admin during a deploy is the
    # worse failure.
    superAdminEmails = ""
    superAdminEmails = ${?SUPER_ADMIN_EMAILS}
}

# ---------------------------------------------------------------------------
# Outbound mail: email verification and password reset.
#
# `host` is empty by default, which selects the console-logging mail sender —
# so the whole flow works locally with no SMTP server, with the links printed
# to the application log. Production cannot use that fallback: startup fails if
# MAIL_HOST is unset when APP_ENV=production.
# ---------------------------------------------------------------------------
mail {
    host = ""
    host = ${?MAIL_HOST}

    # 587 = submission with STARTTLS (the usual choice).
    # 465 = implicit TLS; if you use it, also set MAIL_SSL_ON_CONNECT=true and
    #       MAIL_STARTTLS=false.
    port = 587
    port = ${?MAIL_PORT}

    # Leave both empty for an unauthenticated relay on a trusted network.
    user = ""
    user = ${?MAIL_USER}
    password = ""
    password = ${?MAIL_PASSWORD}

    # The envelope sender. Must be an address the SMTP server is allowed to
    # send as, or the message is rejected or scored as spam.
    from = "no-reply@localhost"
    from = ${?MAIL_FROM}
    fromName = "Aura Beauty Log"
    fromName = ${?MAIL_FROM_NAME}

    startTls = true
    startTls = ${?MAIL_STARTTLS}
    sslOnConnect = false
    sslOnConnect = ${?MAIL_SSL_ON_CONNECT}

    # How long an email-verification link stays usable.
    verificationTokenHours = 24
    verificationTokenHours = ${?VERIFICATION_TOKEN_HOURS}

    # How long a password-reset link stays usable. Deliberately much shorter
    # than verification: a leaked verification link only confirms an address,
    # while a leaked reset link is a full account takeover.
    resetTokenMinutes = 60
    resetTokenMinutes = ${?RESET_TOKEN_MINUTES}
}

jwt {
    # The default is deliberately marked insecure: startup fails in production
    # if this exact value is still in use.
    secret = "dev-only-insecure-secret-change-me"
    secret = ${?JWT_SECRET}
    issuer = "aura-beauty-log"
    issuer = ${?JWT_ISSUER}
    audience = "aura-beauty-log-users"
    audience = ${?JWT_AUDIENCE}
    realm = "Beauty Client Management"

    # How long an access token stays valid. Access tokens are stateless and
    # cannot be revoked, so this expiry is the only bound on the damage a
    # leaked one can do. Keep it short; the refresh token below is what keeps
    # the user signed in, and that one can be revoked.
    accessTokenMinutes = 15
    accessTokenMinutes = ${?ACCESS_TOKEN_MINUTES}

    # How long a user stays signed in without re-entering their password.
    refreshTokenDays = 30
    refreshTokenDays = ${?REFRESH_TOKEN_DAYS}
}

db {
    driver = "org.postgresql.Driver"
    driver = ${?DB_DRIVER}
    url = "jdbc:postgresql://localhost:5432/beautydb"
    url = ${?DB_URL}
    user = "postgres"
    user = ${?DB_USER}
    password = "postgrespassword"
    password = ${?DB_PASSWORD}

    # HikariCP connection pool size. Keep this well below Postgres'
    # max_connections (default 100).
    maxPoolSize = 10
    maxPoolSize = ${?DB_MAX_POOL_SIZE}

    # Falling back to in-memory H2 when Postgres is unreachable is convenient
    # locally and catastrophic in production: the API would report healthy
    # while silently discarding every write. Forced to false when
    # APP_ENV=production.
    allowH2Fallback = true
    allowH2Fallback = ${?DB_ALLOW_H2_FALLBACK}
}
